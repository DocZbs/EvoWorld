[project]
name = "evoworld"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["imageio-ffmpeg>=0.6,<1", "numpy>=2.0,<2.4", "pillow>=11.3,<13"]

[project.scripts]
evoworld = "evoworld.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pyarrow>=18,<19",
    "pytest>=8.4,<9",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evoworld", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["backend: requires initialized heavyweight backend"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
